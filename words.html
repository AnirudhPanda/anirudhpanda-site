<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 0 };
    this.voices = [
      { label: "a finance creator", who: "finance newsletter · sunday edition", text: "1 physio session: ₹1,200. you'll need 6. this costs ₹2,000 once and lives on your desk. it pays for itself by week 2, which is a better return than your fd." },
      { label: "a wellness newsletter", who: "wellness newsletter · 9pm issue", text: "that knot between your shoulder blades has been there since march. you've basically named it. give it 2 minutes tonight, phone in the other room. it's waited long enough." },
      { label: "a fitness brand", who: "fitness brand · instagram caption", text: "leg day ended yesterday. your legs didn't get the memo. 2 minutes with the kinetic and the stairs stop being a negotiation. ₹2,000, link in bio." },
      { label: "a desi mom", who: "family whatsapp group · 6:47am", text: "beta papa bought massage machine. ₹2,000 only. since 3 days he is not giving it to anyone, even dog is waiting in line. forwarding link. reply ok when seen 🙏" }
    ];
  }
  renderVals() {
    const v = this.state.v;
    return {
      line: this.voices[v],
      voices: this.voices.map((x, i) => ({
        label: x.label,
        on: i === v ? "true" : "false",
        bg: i === v ? "#141414" : "#FFFFFF",
        fg: i === v ? "#F3F3F3" : "#141414",
        pick: () => this.setState({ v: i })
      }))
    };
  }
}
</script>
